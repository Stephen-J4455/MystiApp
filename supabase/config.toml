[project]
# Reference your Supabase project ID here
# project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
port = 54321
# Increased timeout for edge function bundling
inspector_port = 8083

[edge_functions]
# Increased bundle timeout to prevent timeout errors
bundle_timeout = 300
# Enable import map
import_map = "./functions/import_map.json"
