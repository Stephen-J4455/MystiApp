# Supabase project configuration.
#
# The Supabase CLI uses this file to know which project to deploy to. We
# keep it generic (project_id commented out) and instead let the deploy
# scripts in supabase/scripts/ pass the right `--project-ref` per
# environment. See supabase/README.md for details.

[project]
# project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
port = 54321
inspector_port = 8083

[edge_functions]
# Increased bundle timeout to prevent timeout errors
bundle_timeout = 300
# Enable import map
import_map = "./functions/import_map.json"

# Mark each function as a verifier of database connectivity.
[functions.health]
verify_jwt = false

[functions.verify_jwt]
# Edge functions that need user authentication keep the default (true).
# All other functions explicitly opt-in above where they should be public.
